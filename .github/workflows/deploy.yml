name: Deploy existing build

on:
  workflow_dispatch:
    inputs:
      version:
        description: New semantic version (for example, 1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deploy must be dispatched from main (got $GITHUB_REF)." >&2
          exit 1
      - name: Verify successful main build
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunsForWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: "main",
              per_page: 50,
            });
            const run = data.workflow_runs.find((candidate) =>
              candidate.path === ".github/workflows/ci.yml" &&
              candidate.head_branch === "main" &&
              candidate.conclusion === "success"
            );
            if (!run) {
              throw new Error("No successful Build and test run was found on main.");
            }
            core.info(`Using successful build run ${run.id} (${run.head_sha}).`);
            core.setOutput("run_id", run.id);
            core.setOutput("head_sha", run.head_sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: esm-ui5-dist
          path: dist/
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and set release version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version
      - name: Pack npm package
        id: pack
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm pack --ignore-scripts
          echo "file=esm-ui5-$VERSION.tgz" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        run: npm publish "${{ steps.pack.outputs.file }}" --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ steps.build.outputs.head_sha }}
          name: esmUi5 ${{ inputs.version }}
          generate_release_notes: true
          files: ${{ steps.pack.outputs.file }}
