name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run check:build-report
      - uses: actions/upload-artifact@v4
        with:
          name: esm-ui5-dist
          path: dist/
          if-no-files-found: error
          retention-days: 90

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: esm-ui5-dist
          path: dist/
      - run: npm test
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: npm run demo:check
        env:
          REQUIRE_BROWSER: "1"
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
