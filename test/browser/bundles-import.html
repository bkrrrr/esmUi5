<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Only the controller imports (bundles/)</title>
	<script type="module">
		import { ready, require } from "../../dist/bundles/esm-ui5-bootstrap.js";

		window.__smoke = async () => {
			await ready;
			const [Controller, Filter, FilterOperator] = await require([
				"sap/ui/core/mvc/Controller", "sap/ui/model/Filter", "sap/ui/model/FilterOperator",
			]);
			const res = performance.getEntriesByType("resource");
			const js = res.filter((r) => r.initiatorType === "script");
			return {
				ok: typeof Controller.extend === "function" && typeof Filter === "function" && FilterOperator.EQ === "EQ",
				jsRequests: js.length,
				jsKiB: Math.round(js.reduce((a, r) => a + r.decodedBodySize, 0) / 1024),
				files: js.map((r) => r.name.replace(location.origin, "")),
				otherRequests: res.filter((r) => r.initiatorType !== "script").length,
				modulesRun: Object.keys(sap.ui.loader._.getAllModules()).length,
			};
		};
		document.body.dataset.esmUi5 = "ready";
	</script>
</head>
<body></body>
</html>
