<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>UI5 Next: import every module</title>
	<script type="module">
		import { ready } from "../../dist/esm/ui5-next-bootstrap.js";

		await ready;
		const list = await (await fetch("./import-all.json")).json();
		const failures = [];
		let done = 0;
		const queue = [...list];
		async function worker() {
			while (queue.length) {
				const m = queue.shift();
				try {
					await import(`../../dist/esm/${m}`);
				} catch (e) {
					failures.push({ module: m, error: String(e?.message ?? e).slice(0, 300) });
				}
				done++;
			}
		}
		await Promise.all(Array.from({ length: 16 }, worker));
		window.__smoke = async () => ({ total: list.length, imported: done - failures.length, failed: failures.length, failures, ok: true });
		document.body.dataset.ui5Next = "ready";
	</script>
</head>
<body class="sapUiBody"><div id="content"></div></body>
</html>
