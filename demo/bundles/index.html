<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>UI5 Next Todo (bundles/)</title>
	<script>
		// Optional UI5 configuration (what data-sap-ui-* attributes on the old bootstrap tag did).
		window["sap-ui-config"] = { theme: "sap_horizon", language: "en" };

		// Show load errors in the page (npm run demo:check reads the rendered DOM).
		function showError(err) {
			const pre = document.createElement("pre");
			pre.id = "ui5-next-error";
			pre.textContent = "UI5 Next demo failed: " + (err && err.stack || err);
			document.body.append(pre);
		}
		addEventListener("error", (e) => showError(e.error || (e.target && e.target.src ? "cannot load " + e.target.src : e.message)), true);
		addEventListener("unhandledrejection", (e) => showError(e.reason));
	</script>
	<script type="module">
		// UI5 modules come from dist/bundles/ (the same paths in esm/ and bundles/).
		// 1. The bootstrap comes first: it configures the runtime and loads the Core before any other UI5 module.
		import { ready, preload } from "../../bundles/ui5-next-bootstrap.js";
		import ComponentContainer from "../../bundles/sap/ui/core/ComponentContainer.js";

		// 2. The app's own modules and descriptor, imported statically: the browser fetches them in parallel
		//    with UI5 instead of discovering them one by one at runtime (the ES module way of Component-preload).
		import "./Component.js";
		import manifest from "./manifest.json" with { type: "json" };
		preload({ "demo/todo/manifest.json": JSON.stringify(manifest) }); // UI5 reads it again by name

		await ready;
		new ComponentContainer({
			name: "demo.todo", // UI5 still asks for the component by name; it is already loaded
			url: ".",
			manifest,
			async: true,
			height: "100%",
			componentCreated: () => (document.body.dataset.ui5Next = "ready"),
		}).placeAt("content");
	</script>
	<style>
		html, body, #content { height: 100%; margin: 0; }
		.ui5NextMode { position: fixed; right: 1rem; bottom: 0.5rem; font: 12px sans-serif; color: #556; }
	</style>
</head>
<body class="sapUiBody">
	<div id="content"></div>
	<div class="ui5NextMode">UI5 from <b>dist/bundles/</b> · <a href="../esm/index.html">esm/ version</a> · <a href="../index.html">demos</a></div>
</body>
</html>
